name: Docker Build Push and Render Deploy

on:
  push:
    branches:
      - main
    paths:
      - "app-mysql/**"
      - ".github/workflows/docker.yml"

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y subir imagen a Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ./app-mysql
          file: ./app-mysql/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/electiva2-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/electiva2-app:${{ github.sha }}

      - name: Desplegar aplicación en Render
        run: |
          curl --fail-with-body \
            --request POST \
            --url "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            --data "{\"imageUrl\":\"docker.io/${{ secrets.DOCKERHUB_USERNAME }}/electiva2-app:latest\"}"