name: Hola Mundo Docker Hub y Render

on:
  push:
    branches:
      - main
    paths:
      - "docker-hola-mundo/**"
      - ".github/workflows/hola-docker-render.yml"

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y subir imagen
        uses: docker/build-push-action@v6
        with:
          context: ./docker-hola-mundo
          file: ./docker-hola-mundo/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            beltr3/docker-hola-mundo:latest
            beltr3/docker-hola-mundo:${{ github.sha }}

      - name: Desplegar en Render
        run: |
          curl --fail-with-body \
            --request POST \
            --url "https://api.render.com/v1/services/${{ secrets.RENDER_HELLO_SERVICE_ID }}/deploys" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            --data "{\"imageUrl\":\"docker.io/beltr3/docker-hola-mundo:latest\"}"