name: Practica Final DevOps CI-CD

on:
  push:
    branches:
      - main
    paths:
      - "practica-final-devops/**"
      - ".github/workflows/practica-final.yml"

jobs:
  test-build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        working-directory: practica-final-devops
        run: python -m pip install -r requirements.txt

      - name: Ejecutar prueba unitaria
        working-directory: practica-final-devops
        run: python -m pytest

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Construir y subir imagen a Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ./practica-final-devops
          file: ./practica-final-devops/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            beltr3/practica-final-devops:latest
            beltr3/practica-final-devops:${{ github.sha }}

      - name: Desplegar en Render
        run: |
          curl --fail-with-body \
            --request POST \
            --url "https://api.render.com/v1/services/${{ secrets.RENDER_FINAL_SERVICE_ID }}/deploys" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            --data "{\"imageUrl\":\"docker.io/beltr3/practica-final-devops:latest\"}"